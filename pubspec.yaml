name: nosiva
description: "Nosiva — a community marketplace for buying & selling pre-loved fashion. 💖"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Routing ---
  go_router: ^14.6.2

  # --- Backend (Supabase: Auth, Postgres, Storage, Realtime) ---
  supabase_flutter: ^2.8.0

  # --- Security ---
  # Backs Supabase's session storage with Android Keystore / iOS Keychain
  # instead of plain SharedPreferences, so the auth session (including the
  # long-lived refresh token) isn't stored in a plain, unencrypted file.
  flutter_secure_storage: ^9.2.4

  # --- Models / serialization ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- UI / theming ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # --- Media ---
  image_picker: ^1.1.2

  # --- Location ---
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # --- Config / utils ---
  flutter_dotenv: ^5.2.1
  intl: '>=0.19.0 <0.21.0'
  uuid: ^4.5.1
  collection: ^1.18.0
  shared_preferences: ^2.5.3
  image_cropper: ^12.2.1
  flutter_cache_manager: ^3.4.1
  image: ^4.8.0
  share_plus: ^12.0.2
  video_player: ^2.11.1
  flutter_native_splash: ^2.4.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/splash/
    - assets/icon/splash_logo.png
    - assets/brand/wordmark.png

# App icon — built from assets/brand/nosiva_logo.jpg. Regenerate with:
# dart run tool/generate_app_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # The foreground image already keeps the mark inside Android's safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# The phone's own launch screen: the white n on the intro video's rose, from
# the moment the app icon is tapped. The in-app splash takes over with the
# identical image (see SplashScreen) and glides it into the intro video.
# splash_logo.png is 1152 px drawn for 4x density = 288 dp everywhere, which
# is also Android 12+'s splash icon size. Regenerate with:
# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#B86982"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#B86982"
    image: assets/icon/splash_logo.png
  ios: true
  web: false
